services:
  frontend:
    image: my-frontend
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Enable live reloading
    command: >
      sh -c "npm install && npm run build && npm start"
    depends_on:
      - backend

  backend:
    image: my-backend
    volumes:
      - ./backend/src:/app/src # Mount your source code
      - ./backend/dist:/app/dist # Mount the dist directory
      - ./frontend/build:/app/frontend-build # Mount the frontend build folder
    build: ./backend
    ports:
      - "5001:5001"
    env_file:
      - backend/.env
    depends_on:
      - mongo
    command: npm run dev

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  frontend-node-modules: