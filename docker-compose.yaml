services:
  frontend:
    image: my-frontend
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Enable live reloading
    depends_on:
      - backend

  backend:
    image: my-backend
    build: ./backend
    ports:
      - "5001:5001"
    env_file:
      - backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  frontend-node-modules: